name: Generate daily close

on:
  schedule:
    # GitHub Actions usa UTC.
    # Perú (America/Lima) = UTC-5.
    # Vigila cada 30 minutos desde 00:10 hasta 17:40 hora de Perú.
    # 05:10-22:40 UTC = 00:10-17:40 Perú.
    - cron: "10,40 5-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-daily-close
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check and generate daily close
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_daily_close.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/es/daily-close/index.json
          git add public/data/en/daily-close/index.json
          git add public/data/pt/daily-close/index.json
          git add public/data/fr/daily-close/index.json

          if git diff --cached --quiet; then
            echo "El cierre Gemini de hoy ya existe o no hubo cambios."
            exit 0
          fi

          git commit -m "chore(daily-close): publish $(TZ=America/Lima date +%F)"
          git push
